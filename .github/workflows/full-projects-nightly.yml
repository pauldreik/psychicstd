      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-realworld-ccache
        with:
          project: boost-asio-full
          build_type: debug
      - name: Install dependencies
        run: >-
          sudo apt-get install -y
          libssl-dev
          python3
      - name: Build Boost.Asio full test set with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project boost-asio-full
          --build-type debug --enable-ccache
  harfbuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-realworld-ccache
        with:
          project: harfbuzz
          build_type: debug
      - name: Install dependencies
        run: >-
          sudo apt-get install -y
          meson
          ninja-build
      - name: Build and test HarfBuzz with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project harfbuzz
          --build-type debug --enable-ccache
  pybind11-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-realworld-ccache
        with:
          project: pybind11-full
          build_type: debug
      - name: Install dependencies
        run: >-
          sudo apt-get install -y
          ninja-build
          python3-dev
          python3-numpy
          python3-pytest
      - name: Build and test pybind11's primary suite with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project pybind11-full
          --build-type debug
          --enable-ccache
  libcamera-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-realworld-ccache
        with:
          project: libcamera-full
          build_type: debug
      - name: Install dependencies
        run: >-
          sudo apt-get install -y
          libyaml-dev
          meson
          ninja-build
          pkg-config
          python3-jinja2
          python3-ply
          python3-yaml
      - name: Build and test libcamera's self-contained suite with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project libcamera-full
          --build-type debug
          --enable-ccache
  libtorrent-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-realworld-ccache
        with:
          project: libtorrent-full
          build_type: debug
      - name: Install dependencies
        run: >-
          sudo apt-get install -y
          libboost-dev
          libssl-dev
          ninja-build
          python3
          zlib1g-dev
      - name: Build and test libtorrent's full suite with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project libtorrent-full
          --build-type debug
          --enable-ccache
