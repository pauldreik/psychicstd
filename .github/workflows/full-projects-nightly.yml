---
name: Full project builds nightly
on:
  schedule:
    - cron: 30 3 * * *
  workflow_dispatch:
jobs:
  # this is for all projects that do not need anything else but
  # common tools (ninja, cmake etc)
  full:
    strategy:
      fail-fast: false
      matrix:
        project: [abseil-full, boost-test-full, cmake-full, googletest-full]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get install -y ccache ninja-build
      - name: Build and test ${{ matrix.project }} with psychicstd
        run: >-
          PATH=/usr/lib/ccache:$PATH scripts/benchmark_realworld.py
          --check-only --project ${{ matrix.project }}
          --build-type debug --enable-ccache
  bitcoin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: >-
          sudo apt-get install -y
          cmake
          libboost-all-dev
          libevent-dev
          ninja-build
          pkg-config
          python3
      - name: Build Bitcoin Core crypto library with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project bitcoin-full
          --build-type debug
  boost-asio-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          sudo apt-get install -y
          libssl-dev
          python3
      - name: Build Boost.Asio full test set with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project boost-asio-full
          --build-type debug
  harfbuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          sudo apt-get install -y
          meson
          ninja-build
      - name: Build and test HarfBuzz with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project harfbuzz
          --build-type debug
  pybind11-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          sudo apt-get install -y
          ccache
          ninja-build
          python3-dev
          python3-numpy
          python3-pytest
      - name: Build and test pybind11's primary suite with psychicstd
        run: >-
          PATH=/usr/lib/ccache:$PATH scripts/benchmark_realworld.py
          --check-only --project pybind11-full
          --build-type debug
          --enable-ccache
  libcamera-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          sudo apt-get install -y
          ccache
          libyaml-dev
          meson
          ninja-build
          pkg-config
          python3-jinja2
          python3-ply
          python3-yaml
      - name: Build and test libcamera's self-contained suite with psychicstd
        run: >-
          PATH=/usr/lib/ccache:$PATH scripts/benchmark_realworld.py
          --check-only --project libcamera-full
          --build-type debug
          --enable-ccache
