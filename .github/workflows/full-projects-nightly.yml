---
name: Full project builds nightly
on:
  schedule:
    - cron: 30 3 * * *
  workflow_dispatch:
jobs:
  # this is for all projects that do not need anything else but
  # common tools (ninja, cmake etc)
  full:
    strategy:
      fail-fast: false
      matrix:
        project: [abseil-full]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build
      - name: Build and test ${{ matrix.project }} with psychicstd
        run: >-
          scripts/benchmark_realworld.py --check-only
          --project ${{ matrix.project }} --build-type debug
  bitcoin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: >-
          sudo apt-get install -y
          cmake
          libboost-all-dev
          libevent-dev
          ninja-build
          pkg-config
          python3
      - name: Build Bitcoin Core crypto library with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project bitcoin-full
          --build-type debug
  boost-asio-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          sudo apt-get install -y
          libssl-dev
          python3
      - name: Build Boost.Asio full test set with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project boost-asio-full
          --build-type debug
  harfbuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          sudo apt-get install -y
          meson
          ninja-build
      - name: Build and test HarfBuzz with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project harfbuzz
          --build-type debug
