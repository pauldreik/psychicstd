---
name: Full project builds nightly
on:
  schedule:
    - cron: 30 3 * * *
  workflow_dispatch:
jobs:
  # this is for all projects that do not need anything else but
  # common tools (ninja, cmake etc)
  full:
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: abseil-full
            build_type: debug
          - project: boost-test-full
            build_type: debug
          - project: cmake-full
            build_type: debug
          - project: cxxopts-full
            build_type: debug
          - project: googletest-full
            build_type: debug
          - project: nlohmann-full
            build_type: debug
          - project: opencv-full
            build_type: release
          - project: pocketfft-full
            build_type: debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-realworld-ccache
        with:
          project: ${{ matrix.project }}
          build_type: ${{ matrix.build_type }}
      - name: Install dependencies
        run: sudo apt-get install -y ninja-build
      - name: Install CMake OpenSSL dependencies
        if: matrix.project == 'cmake-full'
        run: sudo apt-get install -y libssl-dev
      - name: Build and test ${{ matrix.project }} with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project ${{ matrix.project }}
          --build-type ${{ matrix.build_type }} --enable-ccache
  bitcoin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-realworld-ccache
        with:
          project: bitcoin-full
          build_type: debug
      - name: Install Ninja
        run: >-
          sudo apt-get install -y
          cmake
          libboost-all-dev
          libevent-dev
          ninja-build
          pkg-config
          python3
      - name: Build Bitcoin Core crypto library with psychicstd
        run: >-
          scripts/benchmark_realworld.py
          --check-only --project bitcoin-full
          --build-type debug --enable-ccache
  boost-asio-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
