---
name: real-world project builds
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  rdfind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable deb-src
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
      - name: Install rdfind build dependencies
        run: |
          sudo apt-get install -y ccache
          sudo apt-get build-dep -y rdfind
      - name: Build and test rdfind with psychicstd
        run: >-
          PATH=/usr/lib/ccache:$PATH scripts/benchmark_realworld.py
          --check-only --project rdfind
          --build-type debug --enable-ccache
      # TODO: no project here is built with sanitizers yet. rdfind used to
      # have a "run with sanitizers" step, but it silently ignored its own
      # -a/-u flags and just rebuilt the same non-sanitized binary again.
  simdutf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get install -y ccache ninja-build
